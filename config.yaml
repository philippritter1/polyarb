# ------------------------------------------------------------
# Polymarket Arbitrage Bot – Konfiguration (Paper-Trading-MVP)
# ------------------------------------------------------------

mode: paper            # paper | mock   (live ist bewusst noch nicht implementiert)
data_source: websocket # websocket (Echtzeit, empfohlen) | polling (REST alle scan_interval_s)

portfolio:
  starting_capital_usd: 2500

universe:
  refresh_minutes: 30          # wie oft die Marktliste neu geladen wird
  min_liquidity_usd: 1000      # Märkte mit weniger Liquidität ignorieren
  max_markets: 800             # Obergrenze (API-Last)
  include_binary: true         # YES+NO-Arbs (buy & sell)
  include_negrisk_baskets: true  # Multi-Outcome: Summe aller YES-Asks < 1
  include_negrisk_no: true     # Multi-Outcome: Summe aller NO-Asks < n-1 (sofort konvertierbar)
  max_days_to_resolution: 60   # Körbe mit längerer Kapitalbindung ignorieren

scanner:
  scan_interval_s: 8
  min_edge_bps: 50             # Netto-Edge nach Fees, in Basispunkten auf eingesetztes Kapital
  max_edge_bps: 1500           # mehr als 15 % "sicherer" Gewinn = fast immer ein falsch gebauter Korb -> auslassen
  min_profit_usd: 0.50         # Mindestgewinn pro Trade
  min_annualized_return: 0.25  # nur für Körbe mit Kapitalbindung (25 % p.a.)

fees:
  # fee_usd = shares * rate * (p*(1-p))^exponent  (Polymarket-Taker-Fee, 2026)
  # Wenn der Markt ein feeSchedule liefert, hat das Vorrang.
  default_rate: 0.05
  exponent: 1.0
  category_rates:
    crypto: 0.07
    sports: 0.05
    finance: 0.04
    politics: 0.04
    mentions: 0.04
    tech: 0.04
    economics: 0.05
    culture: 0.05
    weather: 0.05
    geopolitics: 0.0
  merge_gas_usd: 0.01          # Merge/Split/Convert auf Polygon (relayer meist gasless)

execution:                     # Realismus der Paper-Simulation
  latency_ms: 350              # Zeit zwischen Erkennung und Order – danach wird das Buch NEU geladen
  depth_haircut: 0.5           # Anteil der sichtbaren Tiefe, den wir realistisch bekommen (Konkurrenz)
  leg_mode: sequential         # sequential: knappstes Leg zuerst, Rest auf dessen Fill skalieren | parallel
  leg_gap_ms: 150              # Zeit zwischen erstem und weiteren Legs (sequential)
  unwind_on_leg_failure: true  # ungehedgte Reste sofort in den Bid verkaufen
  confirm_with_rest: true      # WebSocket-Modus: vor dem Fill frisches REST-Buch laden statt der lokalen Kopie
  consumed_ttl_s: 60           # von Paper-Fills "verbrauchte" Liquidität bleibt so lange aus dem Buch entfernt
  repair_legs: true            # fehlendes Leg nachkaufen statt Rest zu verschleudern, solange das besser ist als der Notverkauf
  respect_market_delay: true   # Order-Verzögerung von Polymarket (secondsDelay, Live-Sport) in die Latenz einrechnen

risk:
  max_trade_pct: 0.10          # max. 10 % des Equity pro Trade (=250 $ bei 2,5k)
  max_market_pct: 0.20         # max. Exposure je Markt/Event
  max_locked_pct: 0.60         # max. Kapital in Körben, die bis Resolution gebunden sind
  max_unhedged_usd: 75         # offene, ungehedgte Reste gesamt
  daily_loss_limit_pct: 0.02   # Kill-Switch: -2 % am Tag -> Handel stoppt
  max_consecutive_leg_failures: 5
  leg_failure_cooldown_min: 30 # Pause nach zu vielen Leg-Failures
  kelly_fraction: 0.5          # Half-Kelly für Körbe mit Resolution-Risiko
  basket_failure_prob: 0.01    # angenommene Wahrscheinlichkeit, dass ein Korb nicht sauber auszahlt
  cash_buffer_pct: 0.10        # immer 10 % Cash liquide halten

stream:
  assets_per_connection: 400   # Token pro WebSocket-Verbindung
  stats_interval_s: 10         # wie oft Kennzahlen/Equity ins Log geschrieben werden

storage:
  db_path: data/polyarb.sqlite

notify:
  scenario: wetter_no_breit    # Alarme (Stillstand, Kill-Switch) für dieses Szenario; der 4-h-Bericht umfasst alle

api:
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  books_batch_size: 100
  timeout_s: 10
  min_request_interval_s: 0.25   # einfache Rate-Limit-Bremse

# ------------------------------------------------------------
# Zusätzliche Paper-Szenarien: jedes läuft als eigener Prozess mit eigenem Budget,
# eigener Datenbank (data/scenario-<name>.sqlite) und eigenem Dashboard-Tab.
# Anders als die Arbitrage können diese Trades verlieren. enabled: false schaltet eines ab.
# ------------------------------------------------------------
scenarios:
  # Alle Szenarien starten mit demselben Budget wie die Arbitrage (2.500 $), damit die
  # Renditen vergleichbar sind. Ändert sich capital_usd, startet das Szenario neu (alte Daten archiviert).
  ladder:
    enabled: true
    title: Logische Arbitrage
    strategy: ladder             # Leitern wie "über 100k / über 110k" oder "bis Oktober / bis Dezember"
    reset: 2                     # 02.10.: Neustart nach dem Billionen-Fehler (alte Daten archiviert)
    capital_usd: 2500
    scan_interval_s: 30          # REST-Polling über alle Leiter-Märkte
    max_events: 300              # meistgehandelte Events nach 24h-Volumen
    max_days_to_resolution: 90
    min_edge_bps: 50
    max_edge_bps: 1500           # 02.10.: "$1.525T" als 1,525 gelesen -> verkehrter Korb, -1.498 $
    min_annualized_return: 0.25  # Kapital ist bis zur Auflösung gebunden
  underdog:
    enabled: false               # abgeschaltet 02.10.: ersetzt durch fussball_dog; live 3 von 99 gewonnen (erwartet 7), -408 $
    title: Underdog-Sport
    strategy: underdog           # Studie 01.08.-30.09. (Kategorien korrigiert): echte Sport-Außenseiter 3-10 % gewannen ~10 % statt ~6 %
    reset: 3                     # v3: nur echte Sportmärkte (v2 hat auch Temperatur-Buckets gekauft)
    category: Sport
    side: underdog
    capital_usd: 2500
    interval_min: 10
    min_price: 0.03              # Außenseiter-Seite kostet mindestens ...
    max_price: 0.10              # ... und höchstens so viel (echter Ask)
    min_volume: 1000             # Volumen beim Kauf (Liquidität)
    min_hours_to_end: 0.5
    max_hours_to_end: 8
    max_spread: 0.03             # breiter als 3 Cent zwischen Bid und Ask -> auslassen
    max_slippage: 0.01
    assumed_edge: 0.03           # nur für die Spalte "Erwartet"
    min_liquidity: 500
    max_position_usd: 10         # viele kleine, gleich große Wetten: die meisten verlieren
    max_event_usd: 30            # pro Spiel
    max_new_per_step: 6
    max_open_positions: 150
  weather_no:
    enabled: true
    title: Wetter-NO
    strategy: band               # Studie: Temperatur-Buckets zu 3-10 % in Märkten unter 5k $ gewannen nur ~1 %
    category: Wetter
    side: "NO"                   # in Anführungszeichen: YAML liest NO sonst als "nein"
    capital_usd: 2500
    interval_min: 10
    min_price: 0.90              # NO-Seite kostet mindestens ...
    max_price: 0.97              # ... und höchstens so viel
    max_volume: 5000             # nur kleine Märkte (Volumen beim Kauf)
    min_hours_to_end: 1
    max_hours_to_end: 30         # Studie: 1 Tag und 6 h vorher gleich stark
    max_spread: 0.02             # der Vorteil sind wenige Cent: enger Spread ist Pflicht
    max_slippage: 0.01
    assumed_edge: 0.04
    min_liquidity: 100
    max_position_usd: 25         # verliert selten, dann aber den ganzen Einsatz
    max_event_usd: 100           # pro Stadt und Tag (höchstens ein Bucket gewinnt)
    max_new_per_step: 10
    max_open_positions: 200
  # --- 01.10.: vier neue Regeln aus der Studie (123.771 Märkte, danach Test auf 11.624 neuen Märkten).
  # Festgeschrieben – nicht nachjustieren, sondern nach 4-6 Wochen nur die Live-Zahlen bewerten.
  fussball_dog:
    enabled: true
    title: Fußball-Außenseiter
    strategy: band               # Studie: +14,5 % nach Kosten; neue Daten (Anfang Juli, WM-Zeit) -18 % -> ungeklärt
    category: Sport
    kinds: [Fussball]            # kein Esports/Tennis/US
    types: [Ueber/Unter, Spread, Remis, Halbzeit]   # "Wer gewinnt?"-Außenseiter verloren -16 bis -50 %
    side: Außenseiter
    capital_usd: 2500
    interval_min: 10
    min_price: 0.03
    max_price: 0.25
    min_volume: 1000
    min_hours_to_end: 0.5
    max_hours_to_end: 8
    max_spread: 0.03
    max_slippage: 0.01
    assumed_edge: 0.03
    min_liquidity: 500
    max_position_usd: 10
    max_event_usd: 30            # pro Spiel
    max_new_per_step: 6
    max_open_positions: 150
  wetter_no_breit:
    enabled: true
    title: Wetter-NO breit
    strategy: band               # Studie: JA-Buckets sind durchweg zu teuer; NO 55-97 % unter 5k $: +8,4 %, neue Daten +5,8 %
    category: Wetter
    outcome: "No"                # nur die NO-Seite
    tag_slugs: [weather]
    side: "NO"                   # in Anführungszeichen: YAML liest NO sonst als "nein"
    capital_usd: 2500
    interval_min: 10
    min_price: 0.55
    max_price: 0.97
    max_volume: 5000             # Volumen beim Kauf; über 5k $ war es negativ
    min_hours_to_end: 2
    max_hours_to_end: 12         # getestet 6 h vorher
    max_spread: 0.02
    max_slippage: 0.01
    assumed_edge: 0.05
    min_liquidity: 100
    max_position_usd: 25
    max_event_usd: 100           # pro Stadt und Tag: höchstens ein Bucket tritt ein
    max_day_usd: 1000            # 02.10.: höchstens so viel auf einen Messtag (alle Städte zusammen)
    max_new_per_step: 10
    max_open_positions: 200
  wetter_no_mess:
    enabled: true
    title: Wetter-NO + Messwerte
    strategy: band               # Studie: JA-Buckets sind durchweg zu teuer; NO 55-97 % unter 5k $: +8,4 %, neue Daten +5,8 %
    category: Wetter
    outcome: "No"                # nur die NO-Seite
    tag_slugs: [weather]
    # 02.10.: wie wetter_no_breit, aber kein Kauf, wenn das heute schon gemessene Maximum im Bucket liegt
    # (Studie, 10.333 Käufe: diese 587 brachten -8,9 %, alle anderen +9 bis +11 %, beide Hälften)
    obs_skip: ["Maximum liegt im Bucket"]
    obs_delay_min: 15            # nur Messungen, die schon 15 min veröffentlicht sind
    side: "NO"                   # in Anführungszeichen: YAML liest NO sonst als "nein"
    capital_usd: 2500
    interval_min: 10
    min_price: 0.55
    max_price: 0.97
    max_volume: 5000             # Volumen beim Kauf; über 5k $ war es negativ
    min_hours_to_end: 2
    max_hours_to_end: 12         # getestet 6 h vorher
    max_spread: 0.02
    max_slippage: 0.01
    assumed_edge: 0.05
    min_liquidity: 100
    max_position_usd: 25
    max_event_usd: 100           # pro Stadt und Tag: höchstens ein Bucket tritt ein
    max_day_usd: 1000            # 02.10.: höchstens so viel auf einen Messtag (alle Städte zusammen)
    max_new_per_step: 10
    max_open_positions: 200
  wetter_no_streng:
    enabled: true
    title: Wetter-NO streng
    strategy: band               # Studie: JA-Buckets sind durchweg zu teuer; NO 55-97 % unter 5k $: +8,4 %, neue Daten +5,8 %
    category: Wetter
    outcome: "No"                # nur die NO-Seite
    tag_slugs: [weather]
    # 02.10.: nur kaufen, wenn das gemessene Maximum mindestens 2 Buckets unter dem Bucket liegt oder ihn
    # schon überschritten hat (Studie: 5.219 Käufe, +10,7 %, Hälften +9,2 / +12,2 %); ohne Messung kein Kauf
    obs_skip: ["Maximum liegt im Bucket", "1 Bucket darunter", "keine Messung"]
    obs_delay_min: 15            # nur Messungen, die schon 15 min veröffentlicht sind
    side: "NO"                   # in Anführungszeichen: YAML liest NO sonst als "nein"
    capital_usd: 2500
    interval_min: 10
    min_price: 0.55
    max_price: 0.97
    max_volume: 5000             # Volumen beim Kauf; über 5k $ war es negativ
    min_hours_to_end: 2
    max_hours_to_end: 12         # getestet 6 h vorher
    max_spread: 0.02
    max_slippage: 0.01
    assumed_edge: 0.05
    min_liquidity: 100
    max_position_usd: 50         # halb so viele Gelegenheiten, Orderbücher tief genug (~470 $ je Markt bis Kaufgrenze)
    max_event_usd: 100           # pro Stadt und Tag: höchstens ein Bucket tritt ein
    max_day_usd: 1000            # 02.10.: höchstens so viel auf einen Messtag (alle Städte zusammen)
    max_new_per_step: 10
    max_open_positions: 200
  wetter_no_maker:
    enabled: true
    title: Wetter-NO Maker
    strategy: band
    # 03.10.: wie wetter_no_mess (gleiche Auswahl), aber als Maker: Limit-Kauf 1 Tick über dem Bid statt den Ask
    # zu zahlen, keine Gebühr. Studie ohne Endvolumen-Filter: Auswahl nur ~+1,5 % – Spread + Gebühr (2-3 %)
    # entscheiden. Strenge Simulation: gefüllt erst, wenn der Ask UNTER das Limit fällt (Verkäufer kreuzt
    # unseren Preis). Gefüllt wird also eher, wenn der Bucket wahrscheinlicher wird – genau das soll der Test zeigen.
    maker: true
    order_ttl_h: 12              # Limit nach so vielen Stunden streichen
    category: Wetter
    outcome: "No"
    tag_slugs: [weather]
    obs_skip: ["Maximum liegt im Bucket"]
    obs_delay_min: 15
    side: "NO"
    capital_usd: 2500
    interval_min: 10
    min_price: 0.55
    max_price: 0.97
    max_volume: 5000             # Volumen beim Kauf, wie wetter_no_mess
    min_hours_to_end: 2          # offene Limits werden 2 h vor Schluss gestrichen
    max_hours_to_end: 12
    max_spread: 0.02
    max_slippage: 0.01
    assumed_edge: 0.05
    min_liquidity: 100
    max_position_usd: 25
    max_event_usd: 100
    max_day_usd: 1000            # zählt offene Limits mit
    max_new_per_step: 10
    max_open_positions: 200      # Positionen + offene Limits
  finanz_dog:
    enabled: false               # abgeschaltet 02.10.: widerlegt – Studie mit 1.011 Wetten -7,6 % (2. Hälfte -23,5 %)
    title: Finanz-Außenseiter
    strategy: band               # Studie: Favoriten bei 75-90 % zu teuer, Außenseiter 10-25 % +36 %; nur 62 Handelstage, neu kaum Daten
    category: Finanz             # Schlusskurse, Hoch/Tief, Up or Down von Aktien, Indizes, Öl, Gold
    exclude_types: [Quartalszahlen]
    max_markets: 6000            # 02.10.: 24 h Fenster – Krypto-5-Minuten-Märkte füllten die Liste
    tag_slugs: [finance, stocks, commodities, economy]  # zusätzlich gezielt nach Thema
    side: Außenseiter
    capital_usd: 2500
    interval_min: 10
    min_price: 0.10
    max_price: 0.25
    min_volume: 1000
    min_hours_to_end: 1
    max_hours_to_end: 24
    max_spread: 0.03
    max_slippage: 0.01
    assumed_edge: 0.04
    min_liquidity: 300
    max_position_usd: 10
    max_event_usd: 30            # pro Leiter (z. B. alle WTI-Schwellen eines Tages)
    max_new_per_step: 6
    max_open_positions: 80
  mlb_spread:
    enabled: true
    title: MLB-Spread-Außenseiter
    strategy: band               # Studie: +25 % (n=133); in den neuen Daten keine Fälle -> ungetestet
    category: Sport
    kinds: [US]
    types: [Spread]
    max_markets: 6000
    tag_slugs: [mlb, baseball]
    side: Außenseiter
    capital_usd: 2500
    interval_min: 10
    min_price: 0.10
    max_price: 0.25
    min_volume: 1000
    min_hours_to_end: 0.5
    max_hours_to_end: 12
    max_spread: 0.03
    max_slippage: 0.01
    assumed_edge: 0.04
    min_liquidity: 300
    max_position_usd: 10
    max_event_usd: 20
    max_new_per_step: 6
    max_open_positions: 80
  favorite:
    enabled: false               # abgeschaltet 30.09.: beruhte auf vermischten Sport/Wetter-Daten; echter Sport: -4,6 %
    title: Favorit-Kleinmarkt
    strategy: favorite
    capital_usd: 2500
  endgame:
    enabled: false               # abgeschaltet 30.09.: Studie über 2 Monate ohne Edge (97,2 % -> 97,5 %, nach Kosten negativ)
    title: Endspiel-Ernte
    strategy: endgame
    reset: 2                     # v2: Fixes nach dem 29.09. (Mindestpreis, nur beendete Spiele, Streuung)
    capital_usd: 2500
    interval_min: 10
    min_price: 0.95              # Favorit kostet mindestens ... (gilt für den echten Ask)
    max_price: 0.99              # ... und höchstens so viel
    max_hours_to_end: 12         # geplantes Ende höchstens so weit in der Zukunft
    max_hours_after_end: 72      # oder bis so lange danach (Ergebnis steht, Auflösung läuft)
    game_hours: 3                # Sportspiele erst ab Anpfiff + 3 h (vorher ist nichts entschieden)
    min_liquidity: 1000
    max_position_usd: 100        # ein Fehlgriff kostet höchstens das (4 % des Budgets)
    max_event_usd: 100           # pro Ereignis/Spiel, nicht pro Einzelmarkt
    max_new_per_step: 2          # höchstens 2 neue Positionen pro Durchlauf
    max_open_positions: 25
  longshot:
    enabled: false               # abgeschaltet 30.09.: Studie über 2 Monate ohne Edge (95,2 % -> 96,0 %, nach Kosten negativ)
    title: Longshot-NO
    strategy: longshot
    capital_usd: 2500
    interval_min: 30
    yes_min: 0.02                # Außenseiter mit YES-Preis zwischen ...
    yes_max: 0.08                # ... und diesem Wert -> NO kaufen
    max_days_to_end: 30
    min_liquidity: 1000
    max_position_usd: 100        # klein und breit gestreut (4 % des Budgets)
    max_event_usd: 300
    max_new_per_step: 3
    max_open_positions: 40
  weather:
    enabled: false               # abgeschaltet 02.10.: Wetter-Modell verliert auch live; Messwert-Studie: Markt preist Stationen sofort ein
    title: Wetter-Modell
    strategy: weather
    reset: 2                     # neuer Wert = Szenario startet neu (v2: Fixes nach dem Totalverlust am 29.09.)
    capital_usd: 2500
    interval_min: 20
    models: gfs_seamless,ecmwf_ifs025,icon_seamless   # Open-Meteo Ensembles, kostenlos
    min_edge: 0.08               # Modell-Wahrscheinlichkeit muss so viel über dem Preis liegen ...
    max_edge: 0.30               # ... aber nicht mehr: größere Abweichung = Modell liegt falsch
    min_ask: 0.03                # nichts kaufen, was der Markt praktisch bei 0 sieht
    min_prob: 0.05
    min_days_ahead: 1            # nie einen Tag handeln, der in der Stadt schon begonnen hat
    max_days_ahead: 2
    sigma_f: 2.5                 # Unsicherheit Station vs. Modell in °F ...
    sigma_c: 1.5                 # ... bzw. °C (vorher 1,8/1,0: viel zu selbstsicher)
    kelly_fraction: 0.10
    max_slippage: 0.03           # höchstens 3 Cent über dem besten Ask kaufen
    max_position_usd: 200
    max_event_usd: 400
    max_open_positions: 30
